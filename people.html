<!DOCTYPE html>
<html lang="en">
  <head>
    <title>people | rcv</title>
    <meta charset="UTF-8" />
    <meta name="description" content="voting in ranked choice" />
    <meta name="viewport" content="width=device-width" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ranked choice voting" />
    <meta property="og:description" content="voting in ranked choice" />
    <meta property="og:url" content="https://rcv.sammy.pizza" />
    <meta property="og:site_name" content="ranked choice voting" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      let url = new URL(window.location.href);

      function onSubmit(event) {
        const inputElement = document.getElementsByTagName("input")[0];
        const person = inputElement.value;
        if (person.length < 0) {
          alert("Enter a person name!");
          return;
        }
        const liElement = document.createElement("li");
        liElement.innerHTML = person;
        const ulElement = document.getElementsByTagName("ul")[0];
        ulElement.appendChild(liElement);
        url.searchParams.append("p", person);
        history.replaceState(history.state, "", url.href);
      }
    </script>
    <style>
      div {
        display: flex;
        justify-content: space-between;
        gap: 0.4em;
      }
    </style>
  </head>
  <body>
    <h1>people</h1>
    <div>
      <div class="form">
        <label for="people-input">add people to hold votes</label>
        <input name="people-input" id="people-input" />
        <button onclick="onSubmit()">add person</button>
      </div>
      <a
        style="color: blue"
        onclick="window.location='./voting.html'+window.location.search;"
        >next: voting</a
      >
    </div>
    <ul>
      <p>people</p>
    </ul>
  </body>
</html>
